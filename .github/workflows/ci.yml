name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1

      - name: Wait for RabbitMQ
        run: |
          for i in $(seq 1 30); do
            curl -sf -u guest:guest http://127.0.0.1:15672/api/overview >/dev/null && break
            sleep 2
          done

      - name: Unit tests
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Integration tests
        env:
          RMQ_CLUE_TEST_AMQP_URL: amqp://guest:guest@127.0.0.1:5672/%2F
        run: go test -race ./internal/replay/ -run Integration

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rabbitmq-clue:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max