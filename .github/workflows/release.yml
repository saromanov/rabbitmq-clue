name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  frontend:
    name: Build web UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
          retention-days: 1

  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal/web/dist

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/saromanov/rabbitmq-clue/internal/version.version=${VERSION} -X github.com/saromanov/rabbitmq-clue/internal/version.commit=${COMMIT}" \
            -o "rabbitmq-clue" ./cmd/rabbitmq-clue

      - name: Archive (unix)
        if: matrix.goos != 'windows'
        run: |
          ARCHIVE="rabbitmq-clue_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -czf "$ARCHIVE" rabbitmq-clue
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Archive (windows)
        if: matrix.goos == 'windows'
        run: |
          ARCHIVE="rabbitmq-clue_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          zip "$ARCHIVE" rabbitmq-clue.exe
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: archives-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/saromanov/rabbitmq-clue
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [binaries, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: archives-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > ../checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            checksums.txt
          generate_release_notes: true