version: "2"

linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - unparam
    - gosec
  settings:
    gosec:
      excludes:
        - G402
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports